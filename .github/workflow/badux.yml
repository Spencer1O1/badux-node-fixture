name: Badux publish
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: badux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BADUX_OUTPUT: "dist"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: "npm run build"
      - name: Check site entry point
        run: test -d "$BADUX_OUTPUT" && test ! -L "$BADUX_OUTPUT" && test -s "$BADUX_OUTPUT/index.html" && test ! -L "$BADUX_OUTPUT/index.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badux-site
          path: "dist"
          if-no-files-found: error
